[platformio]
default_envs = lego

[env:lego]
platform = espressif32 @6.8.1
board = esp32dev 
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = default, time

build_unflags = 
	-std=gnu++11
	-Os

build_flags = 
	-DCORE_DEBUG_LEVEL=0
	-std=gnu++17
	-Wall
	-Wextra
	-Wunused-variable
	-Wshadow
	-O3 

extra_scripts =
	pre:scripts/webpage_to_minimized_cpp.py

lib_deps =
	WiFi @ 2.0.0
	WebServer @ 2.0.0
	DNSServer @ 2.0.0
	Wire @ 2.0.0

	# External libs
	fastled/FastLED @ 3.6.0
	ArduinoJson @ 6.21.3


# Over-The-Air upload
[env:lego_ota]
extends = env:lego
upload_protocol = espota
upload_port = ota-hostname-lego-car.local
upload_flags =
	--timeout=30

extra_scripts = 	
	pre:scripts/ota_password_from_secrets.py
